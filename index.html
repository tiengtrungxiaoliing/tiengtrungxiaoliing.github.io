<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#556B2F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xiaoliing">
<title>Tiếng Trung Xiaoliing – Góc ôn luyện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js" defer></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
<style>
:root{
  --olive:#556B2F; --olive-d:#435524; --olive-l:#8A9A5B; --sage:#C9D3A8; --sage-l:#E4E9CF;
  --cream:#F6E7C6; --paper:#FBF5E6; --card:#FFFBF1;
  --wood:#9A7348; --wood-d:#6E4F2C; --ink:#3A3826; --muted:#7A745E; --line:#E8D9B5;
  --red:#B5543C; --red-l:#F3DCD3; --gold:#C9A04A;
  --r:18px; --shadow:0 2px 0 rgba(110,79,44,.08),0 6px 18px rgba(85,107,47,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Nunito',sans-serif;font-weight:800;margin:0;color:var(--olive-d)}
.hz{font-family:'LXGW WenKai','KaiTi','STKaiti','Kaiti SC',serif;font-weight:400}
button{font-family:inherit;cursor:pointer}
a{color:var(--olive);cursor:pointer}

.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:230px;flex-shrink:0;background:var(--olive);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.06) 0 40px,transparent 41px),radial-gradient(circle at 90% 60%,rgba(0,0,0,.06) 0 60px,transparent 61px)}
.sign{position:relative;background:linear-gradient(180deg,#B08556,var(--wood) 60%,#8A6640);border:3px solid var(--wood-d);border-radius:14px;padding:12px 10px 10px;text-align:center;color:#FFF3DA;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 var(--wood-d)}
.sign::before,.sign::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:var(--wood-d)}
.sign::before{left:8px}.sign::after{right:8px}
.sign small{display:block;font-size:12px;letter-spacing:.5px;opacity:.9}
.sign b{display:block;font-weight:800;font-family:'Nunito',sans-serif;font-size:26px;line-height:1.15}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#F6E7C6;padding:11px 14px;border-radius:14px;font-size:15px;font-weight:500;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--cream);color:var(--olive-d);font-weight:700}
.nav .sep{color:rgba(246,231,198,.55);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:10px 14px 2px}
.ico{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mascot{margin-top:auto;text-align:center}
.mascot svg{width:100%;display:block;margin:0 auto 8px;position:relative;z-index:1}
.tip{background:rgba(246,231,198,.14);border:1.5px dashed rgba(246,231,198,.45);border-radius:14px;padding:12px;color:#F6E7C6;font-size:13px}
.tip b{display:block;font-family:'Nunito',sans-serif;font-size:15px;margin-bottom:4px}

/* Main */
main{flex:1;min-width:0;padding:0 24px 40px}
.hero{position:relative;margin:0 -24px 20px;padding:26px 24px 24px;min-height:150px;background:linear-gradient(180deg,#EEF0DA,#F5EFD9);overflow:hidden;border-bottom:1px solid var(--line)}
.hero .forest{position:absolute;right:0;bottom:0;height:100%;width:72%;max-width:780px;pointer-events:none}
.hero-text{position:relative;max-width:55%}
.hero h1{font-size:30px;display:flex;align-items:center;gap:10px}
.hero p{margin:6px 0 0;color:var(--muted)}
.hero-box{position:absolute;right:20px;top:16px;background:rgba(255,251,241,.92);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;z-index:2}
.role{display:flex;background:var(--cream);border-radius:999px;padding:3px}
.role button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:12px;color:var(--muted);font-weight:600}
.role button.on{background:var(--olive);color:#fff}
.demo-note{font-size:11px;color:var(--wood)}

.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-h h3{font-size:18px;flex:1}
.card-h a{font-size:13px;font-weight:600;text-decoration:none}
.leaf{width:20px;height:20px;color:var(--olive)}
.tile{background:var(--cream);border-radius:14px;padding:12px 14px}
.tile small{color:var(--muted);font-size:12px;display:block}
.tile .big{font-size:26px;font-weight:700;color:var(--olive-d);font-family:'Nunito',sans-serif}
.row{display:flex;align-items:center;gap:10px}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.list-item b{display:block;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--sage-l);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--olive-l);border-radius:99px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sage-l);color:var(--olive-d);white-space:nowrap}
.pill.warn{background:#F6E2B8;color:#8A5A12}.pill.bad{background:var(--red-l);color:var(--red)}.pill.ok{background:var(--sage);color:var(--olive-d)}
.btn{border:0;background:var(--olive);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 3px 0 var(--olive-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--olive-d)}
.btn.ghost{background:var(--cream);color:var(--olive-d);box-shadow:0 3px 0 var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.red{background:var(--red);box-shadow:0 3px 0 #8B3D2A}
.btn.gold{background:var(--gold);box-shadow:0 3px 0 #9C7A30}
.banner{display:flex;align-items:center;gap:12px;background:#F6E2B8;border:1px solid #E9CD8E;color:#6E4B10;border-radius:14px;padding:12px 16px;margin-bottom:18px;font-size:14px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .dh{color:var(--muted);font-weight:600}
.cal .d{padding:6px 0;border-radius:8px;position:relative}
.cal .d.today{background:var(--olive);color:#fff;font-weight:700}
.cal .d.due::after{content:"";position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}

/* word of day */
.wod{text-align:center}
.wod .hz{font-size:54px;color:var(--olive-d);line-height:1.2}
.icon-btn{border:0;background:var(--cream);color:var(--olive-d);width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--sage)}

/* rank */
.rank-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--cream);color:var(--wood-d);flex-shrink:0}
.rank-n.r1{background:var(--gold);color:#fff}.rank-n.r2{background:#B9B7A6;color:#fff}.rank-n.r3{background:#B98252;color:#fff}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--sage);color:var(--olive-d);display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:14px}
.me-row{background:var(--sage-l);border-radius:12px;padding-left:8px;padding-right:8px}

/* exercise */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.q-h{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.q-n{background:var(--olive);color:#fff;border-radius:10px;padding:2px 10px;font-weight:700;font-size:13px}
.q-t{font-size:12px;color:var(--wood);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.q-prompt{font-size:17px;margin-bottom:12px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;font-size:16px}
.opt.sel{border-color:var(--olive);background:var(--sage-l)}
.opt.right{border-color:var(--olive);background:var(--sage)}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:16px;text-align:center}
.chip.active{border-color:var(--olive);box-shadow:0 0 0 3px var(--sage)}
.c0{background:#E4E9CF;border-color:#8A9A5B}.c1{background:#F6E2B8;border-color:#C9A04A}.c2{background:#E7D7C4;border-color:#9A7348}.c3{background:#D9E5E0;border-color:#5E8C7A}.c4{background:#F0D9D2;border-color:#B5543C}
.order-line{min-height:54px;border:2px dashed var(--olive-l);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;background:var(--paper)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.fill-in{font-size:18px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;width:120px;text-align:center;font-family:'LXGW WenKai','KaiTi',serif;background:#fff}
.fill-in:focus{outline:none;border-color:var(--olive)}
.fb{margin-top:10px;font-size:14px;padding:8px 12px;border-radius:10px}
.fb.ok{background:var(--sage-l);color:var(--olive-d)}.fb.no{background:var(--red-l);color:var(--red)}
.score-card{text-align:center;padding:26px}
.score-card .big{font-family:'Nunito',sans-serif;font-size:48px;color:var(--olive-d);font-weight:700}

/* flashcard */
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.flash{width:100%;max-width:460px;min-height:280px;background:linear-gradient(180deg,#FFFBF1,var(--cream));border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;cursor:pointer;position:relative}
.flash .hz{font-size:72px;color:var(--olive-d);line-height:1.2}
.flash .py{font-size:24px;color:var(--wood);font-weight:600}
.flash .mn{font-size:20px;margin-top:6px}
.flash .ex{margin-top:12px;font-size:14px;color:var(--muted)}
.flash .hint{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.rate{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rate .btn{flex-direction:column;gap:0;min-width:110px}
.rate small{font-weight:400;font-size:11px;opacity:.85}
.boxes{display:flex;gap:8px;align-items:flex-end;height:90px}
.boxes div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.boxes i{display:block;background:var(--olive-l);border-radius:6px 6px 0 0;margin-bottom:4px;min-height:4px}
.lv{display:flex;gap:6px}
.lv button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-weight:600;color:var(--muted)}
.lv button.on{border-color:var(--olive);background:var(--olive);color:#fff}

.mode-tabs{display:flex;gap:6px;background:var(--cream);padding:4px;border-radius:14px;margin-bottom:16px;flex-wrap:wrap}
.mode-tabs button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:10px;font-weight:700;color:var(--muted);font-size:14px}
.mode-tabs button.on{background:var(--olive);color:#fff}
.pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ptile{aspect-ratio:1.3;border:2px solid var(--line);border-radius:14px;background:var(--olive-l);color:transparent;font-size:15px;font-weight:700;display:grid;place-items:center;padding:6px;text-align:center}
.ptile.open{background:#fff;color:var(--ink);border-color:var(--olive)}
.ptile.done{background:var(--sage);color:var(--olive-d);border-color:var(--sage);opacity:.6}
.ptile.hz.open,.ptile.hz.done{font-size:30px}
.speed-q{font-size:68px;text-align:center;color:var(--olive-d);margin:10px 0}
.timer{font-size:28px;font-weight:800;color:var(--olive-d)}
.timer.low{color:var(--red)}
.progress-sticky{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 10px;margin-bottom:6px}
.pic{width:120px;height:120px;margin:0 auto 12px;display:block}
@media (max-width:860px){.pairs{grid-template-columns:repeat(3,minmax(0,1fr))}.speed-q{font-size:56px}}
.slot{border:2px dashed var(--olive-l);background:#fff;border-radius:8px;padding:2px 10px;margin:0 4px;font-weight:800;color:var(--olive-d);font-family:'Nunito',sans-serif;font-size:15px;vertical-align:middle}
.slot.sel{background:var(--olive);color:#fff;border-style:solid}.slot.right{background:var(--sage);border-style:solid}.slot.wrong{background:var(--red-l);border-color:var(--red);color:var(--red)}
.chip.sel{border-color:var(--olive);background:var(--sage-l)}.chip.right{border-color:var(--olive);background:var(--sage)}.chip.wrong{border-color:var(--red);background:var(--red-l)}
.sent{font-size:24px;line-height:2.1}
.gcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.gcard .hz{font-size:24px;color:var(--olive-d)}
/* table, form */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:8px;border-bottom:2px solid var(--line)}
td{padding:10px 8px;border-bottom:1px dashed var(--line);vertical-align:top}
.form{display:grid;gap:14px}
.form label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
.form input,.form select{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.form input:focus,.form select:focus{outline:none;border-color:var(--olive)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{flex-direction:row;align-items:center;gap:6px;background:var(--cream);padding:6px 12px;border-radius:99px;font-weight:500}
select.inline{font:inherit;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:#fff}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(58,56,38,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal-c{background:var(--card);border-radius:22px;padding:22px;max-width:520px;width:100%;text-align:center}
.writers{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.writers div{background:#fff;border:2px solid var(--line);border-radius:14px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:50% 50%;background-position:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--olive-d);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-size:14px;box-shadow:var(--shadow)}

.topbar,.bnav{display:none}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .sidebar{display:none}
  main{padding:0 14px 96px}
  .hero{margin:0 -14px 16px;padding:16px 14px;min-height:0}
  .hero .forest{width:100%;opacity:.35}
  .hero-text{max-width:100%}
  .hero h1{font-size:22px}
  .hero-box{position:relative;right:auto;top:auto;margin-top:12px;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px}
  .topbar{display:flex;align-items:center;gap:10px;background:var(--olive);margin:0 -14px;padding:10px 14px}
  .topbar .sign{padding:4px 12px}.topbar .sign b{font-size:18px}.topbar .sign small{display:none}
  .topbar .sign::before,.topbar .sign::after{display:none}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--olive);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
  .bnav button{flex:1;min-width:64px;border:0;background:transparent;color:#F6E7C6;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 2px;border-radius:12px}
  .bnav button.on{background:var(--cream);color:var(--olive-d);font-weight:700}
  .g3,.g2{grid-template-columns:1fr}.span2{grid-column:auto}
  .opts{grid-template-columns:1fr}
  table{font-size:13px}
}

/* bản thật */
#gate{display:none}
body.gated .app,body.gated .bnav{display:none!important}
body.gated #gate{display:grid;min-height:100vh;place-items:center;padding:20px;background:linear-gradient(180deg,#EEF0DA,var(--paper))}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 26px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;align-items:center}
.gate-card .sign{width:200px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.lesson-btn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-weight:800;color:var(--olive-d);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lesson-btn:hover{border-color:var(--olive);background:var(--sage-l)}
.lesson-btn small{font-weight:600;color:var(--muted);font-size:11px}
.big-hz .hz{font-size:52px;color:var(--olive-d)}
.sent .hz,.sent.hz{font-size:24px;line-height:2}
.hzo{font-size:22px;text-align:center}
.ls-h{font-size:16px;margin:18px 0 10px;color:var(--wood-d)}
.gcard b{font-size:15px}.gcard .st{font-size:18px}
.gex{background:var(--cream);border-radius:10px;padding:8px 10px;font-size:14px}
.gex .hz{font-size:18px}
.table-wrap{overflow-x:auto}
.cell-in{font:inherit;border:2px solid var(--line);border-radius:10px;padding:6px 8px;width:100%;min-width:140px}
select.inline.sm{padding:5px 8px;font-size:13px}
.ok-banner{background:var(--sage-l);border-color:var(--sage);color:var(--olive-d)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.flash .ex{white-space:pre-line}
.nav button:last-child{margin-top:8px;opacity:.8}
.link-btn{border:0;background:none;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:4px;text-decoration:underline}
.link-btn .ico{width:15px;height:15px}
.report{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff;display:flex;flex-direction:column;gap:6px}
.report.done{opacity:.6}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.choice{border:2px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;color:var(--ink)}
.choice.on{border-color:var(--olive);background:var(--olive);color:#fff}
.fb-form textarea{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;resize:vertical}
.fb-form textarea:focus{outline:none;border-color:var(--olive)}
.fb-form label{font-weight:700}
.anon{flex-direction:row!important;align-items:center;font-weight:500!important}
.mins7{display:flex;gap:8px;align-items:flex-end;height:100px}
.mins7 div{flex:1;text-align:center;font-size:12px}

<body class="gated">
<div id="gate"><div class="gate-card"><p class="muted">Đang tải…</p></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="sign"><small>Tiếng Trung</small><b>Xiaoliing</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="mascot" id="mascot"></div>
  </aside>
  <main>
    <div class="topbar"><div class="sign"><small>Tiếng Trung</small><b>Xiaoliing</b></div></div>
    <header class="hero" id="hero"></header>
    <div id="view"></div>
  </main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="layer"></div>
<script>
/* ===== Xiaoliing – phần xử lý dữ liệu (không phụ thuộc Firebase) ===== */
const EXT = 99; // bài "Mở rộng"
const strip = s => String(s ?? '').trim();
const PUNCT = /[。，！？、,.!?；;：:\s]/g;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const HZ = t => `<span class="hz">${esc(t)}</span>`;
const lessonLabel = n => n >= EXT ? 'Mở rộng' : 'Bài ' + n;

function lessonNum(v) {
  const s = strip(v); if (!s) return null;
  if (/mở rộng|ngoài/i.test(s)) return EXT;
  const m = s.match(/\d+/); return m ? +m[0] : null;
}

/* Bảng tính -> danh sách đối tượng theo tên cột */
function sheetToObjects(rows) {
  const hi = rows.findIndex(r => r && r.filter(x => strip(x)).length >= 3);
  if (hi < 0) return { headers: [], items: [] };
  const headers = rows[hi].map(strip), items = [];
  for (let i = hi + 1; i < rows.length; i++) {
    const r = rows[i]; if (!r || !r.some(x => strip(x))) continue;
    const o = { _row: i + 1 }; headers.forEach((h, j) => o[h] = strip(r[j])); items.push(o);
  }
  return { headers, items };
}

const SHEETS = {
  TuVung: ['Cấp độ', 'Bài', 'Loại (Từ/Câu)', 'Chữ Hán', 'Pinyin', 'Nghĩa tiếng Việt'],
  NguPhap: ['Mã', 'Cấp độ', 'Bài', 'Điểm ngữ pháp', 'Cấu trúc', 'Giải thích'],
  ViDuNguPhap: ['Mã điểm ngữ pháp', 'Cấp độ', 'Bài', 'Câu ví dụ (tách từ bằng /)', 'Từ khóa (để che khi điền từ)', 'Dịch câu'],
  CauHoiDacBiet: ['Cấp độ', 'Bài', 'Dạng bài', 'Câu hỏi', 'Đáp án']
};

function parseSpecial(it, where, errors) {
  const type = it['Dạng bài'], ans = strip(it['Đáp án']).toUpperCase();
  const base = { label: type, topic: it['Chủ đề / điểm ngữ pháp'] || '', expl: it['Giải thích'] || '' };
  if (type === 'Tìm lỗi sai') {
    const segs = it['Câu hỏi'].split('/').map(strip).filter(Boolean), a = parseInt(ans) - 1;
    if (!(a >= 0 && a < segs.length)) { errors.push(`${where}: "Tìm lỗi sai" cần Đáp án là số thứ tự phần sai (1, 2, 3…)`); return null; }
    return { ...base, type: 'error', segs, a };
  }
  if (type === 'Chọn vị trí đúng') {
    const n = (it['Câu hỏi'].match(/\[[A-D]\]/g) || []).length, a = 'ABCD'.indexOf(ans);
    if (n < 2 || a < 0 || a >= n || !it['Từ cần đặt']) { errors.push(`${where}: "Chọn vị trí đúng" cần [A] [B]… trong câu hỏi, cột Từ cần đặt và Đáp án A–D`); return null; }
    return { ...base, type: 'pos', s: it['Câu hỏi'], word: it['Từ cần đặt'], a };
  }
  const opts = ['A', 'B', 'C', 'D'].map(k => it[k]).filter(Boolean), a = 'ABCD'.indexOf(ans);
  if (opts.length < 2 || a < 0 || a >= opts.length) { errors.push(`${where}: cần ít nhất 2 lựa chọn và Đáp án A, B, C hoặc D`); return null; }
  return { ...base, special: true, type: 'mc', prompt: it['Câu hỏi'], opts, a, hzOpts: opts.every(o => /\p{Script=Han}/u.test(o)) };
}

/* sheets: { tên trang: mảng hàng (mảng ô) } -> { levels, errors, warn } */
function parseContent(sheets) {
  const errors = [], warn = [], levels = {};
  const L = lv => levels[lv] || (levels[lv] = { vocab: [], sentences: [], grammar: [], examples: [], questions: [] });
  for (const [name, need] of Object.entries(SHEETS)) {
    if (!sheets[name]) { errors.push(`Thiếu trang tính "${name}"`); continue; }
    const { headers, items } = sheetToObjects(sheets[name]);
    const miss = need.filter(c => !headers.includes(c));
    if (miss.length) { errors.push(`Trang "${name}" thiếu cột: ${miss.join(', ')}`); continue; }
    for (const it of items) {
      const where = `${name}, dòng ${it._row}`, lv = it['Cấp độ'], ls = lessonNum(it['Bài']);
      if (!/^HSK[1-9]$/.test(lv)) { errors.push(`${where}: Cấp độ phải ghi dạng HSK1, HSK2…`); continue; }
      if (ls === null) { errors.push(`${where}: cột Bài không hợp lệ ("${it['Bài']}")`); continue; }
      if (name === 'TuVung') {
        if (!it['Chữ Hán'] || !it['Pinyin'] || !it['Nghĩa tiếng Việt']) { errors.push(`${where}: thiếu Chữ Hán, Pinyin hoặc Nghĩa`); continue; }
        const o = { h: it['Chữ Hán'], p: it['Pinyin'], m: it['Nghĩa tiếng Việt'], hv: it['Hán Việt'] || '', pos: it['Từ loại'] || '', ex: it['Ví dụ'] || '', ls };
        (/câu/i.test(it['Loại (Từ/Câu)']) ? L(lv).sentences : L(lv).vocab).push(o);
      } else if (name === 'NguPhap') {
        L(lv).grammar.push({ id: it['Mã'], ls, group: it['Nhóm'] || '', name: it['Điểm ngữ pháp'], st: it['Cấu trúc'], expl: it['Giải thích'], hz: it['Ví dụ'] || '', py: it['Pinyin'] || '', vi: it['Dịch'] || '' });
      } else if (name === 'ViDuNguPhap') {
        const toks = it['Câu ví dụ (tách từ bằng /)'].split('/').map(strip).filter(Boolean), key = it['Từ khóa (để che khi điền từ)'];
        if (toks.length < 2) { errors.push(`${where}: câu ví dụ cần tách ít nhất 2 phần bằng dấu /`); continue; }
        const ki = key ? toks.findIndex(t => t.replace(PUNCT, '') === key.replace(PUNCT, '')) : -1;
        if (key && ki < 0) { errors.push(`${where}: Từ khóa "${key}" không có trong câu ví dụ`); continue; }
        L(lv).examples.push({ gid: it['Mã điểm ngữ pháp'], ls, toks, ki, vi: it['Dịch câu'] });
      } else {
        if (!/x/i.test(it['Đã duyệt (x)'] || '')) continue;
        const q = parseSpecial(it, where, errors); if (q) L(lv).questions.push({ ...q, ls });
      }
    }
  }
  for (const [lv, d] of Object.entries(levels)) {
    const seen = new Set();
    d.vocab = d.vocab.filter(v => { const id = v.h + '|' + v.p.replace(/\s/g, ''); if (seen.has(id)) { warn.push(`${lv}: từ "${v.h}" (${v.p}) bị lặp, chỉ giữ dòng đầu`); return false; } seen.add(id); return true; });
    const cnt = {}; d.vocab.forEach(v => cnt[v.h] = (cnt[v.h] || 0) + 1);
    d.vocab.forEach(v => v.k = cnt[v.h] > 1 ? v.h + '|' + v.p.replace(/\s/g, '') : v.h);
    const ids = new Set(d.grammar.map(g => g.id));
    d.examples.forEach(e => { if (e.gid && !ids.has(e.gid)) warn.push(`${lv}: câu ví dụ có mã "${e.gid}" không có trong trang NguPhap`); });
  }
  return { levels, errors, warn };
}

/* ===== Tạo câu hỏi ===== */
const TONES = { a: 'āáǎà', e: 'ēéěè', i: 'īíǐì', o: 'ōóǒò', u: 'ūúǔù', 'ü': 'ǖǘǚǜ' };
const TONE_OF = {}; for (const [b, s] of Object.entries(TONES)) [...s].forEach((c, i) => TONE_OF[c] = [b, i]);
function toneVariants(py) {
  const ch = [...py], idx = ch.findIndex(c => TONE_OF[c]); if (idx < 0) return [];
  const [b, t] = TONE_OF[ch[idx]];
  return [0, 1, 2, 3].filter(k => k !== t).map(k => { const c = [...ch]; c[idx] = TONES[b][k]; return c.join(''); });
}
function mcOpts(correct, pool) {
  const others = shuffle([...new Set(pool.filter(x => x && x !== correct))]).slice(0, 3);
  const opts = shuffle([correct, ...others]); return { opts, a: opts.indexOf(correct) };
}
const hanChars = w => [...w].filter(c => /\p{Script=Han}/u.test(c));

function vocabQ(w, pool, kind) {
  const P = k => pool.map(x => x[k]);
  switch (kind) {
    case 'meaning': return { type: 'mc', label: 'Chọn nghĩa đúng', prompt: `<span class="big-hz">${HZ(w.h)}</span>`, ...mcOpts(w.m, P('m')), w: w.k || w.h };
    case 'hanzi': return { type: 'mc', label: 'Chọn chữ Hán đúng', prompt: `Từ nào nghĩa là <b>"${esc(w.m)}"</b>?`, hzOpts: true, ...mcOpts(w.h, P('h')), w: w.k || w.h };
    case 'pinyin': return { type: 'mc', label: 'Chọn pinyin đúng', prompt: `<span class="big-hz">${HZ(w.h)}</span>`, ...mcOpts(w.p, P('p')), w: w.k || w.h };
    case 'tone': { const v = toneVariants(w.p); if (v.length < 3) return null; const opts = shuffle([w.p, ...v]);
      return { type: 'mc', label: 'Chọn thanh điệu đúng', prompt: `<span class="big-hz">${HZ(w.h)}</span> <span class="muted">${esc(w.m)}</span>`, opts, a: opts.indexOf(w.p), w: w.k || w.h }; }
    case 'listen': return { type: 'listen', label: 'Nghe chọn từ', prompt: 'Nghe và chọn từ đúng.', say: w.h, hzOpts: true, ...mcOpts(w.h, P('h')), w: w.k || w.h };
    case 'write': { const c = hanChars(w.h); if (!c.length || c.length > 3) return null;
      return { type: 'write', label: 'Viết chữ', prompt: `Viết <b>"${esc(w.m)}"</b> <span class="muted">(${esc(w.p)})</span>`, chars: c, w: w.k || w.h }; }
  }
}
function matchQ(words) {
  const ws = shuffle(words).slice(0, 4); if (ws.length < 3) return null;
  return { type: 'match', label: 'Nối từ với nghĩa', prompt: 'Chạm vào một từ bên trái, rồi chạm vào nghĩa bên phải.', left: ws.map(w => w.h), right: ws.map(w => w.m), shuf: shuffle(ws.map((_, i) => i)) };
}
function exampleQ(e, pool, kind) {
  const sent = e.toks.join('');
  if (kind === 'order' && e.toks.length > 8) kind = e.ki >= 0 ? 'fill' : 'translate';
  if (kind === 'order') {
    let words = shuffle(e.toks); for (let k = 0; k < 5 && words.join('') === sent; k++) words = shuffle(e.toks);
    return { type: 'order', label: 'Sắp xếp câu', prompt: `Sắp xếp thành câu: <b>"${esc(e.vi)}"</b>`, words, a: sent };
  }
  if (kind === 'fill' && e.ki >= 0) {
    const key = e.toks[e.ki].replace(PUNCT, ''), shown = e.toks.map((t, i) => i === e.ki ? t.replace(key, '____') : t).join(' ');
    return { type: 'mc', label: 'Chọn từ điền vào chỗ trống', prompt: `<span class="sent">${HZ(shown)}</span><div class="muted">${esc(e.vi)}</div>`, hzOpts: true,
      ...mcOpts(key, pool.filter(x => x.ki >= 0).map(x => x.toks[x.ki].replace(PUNCT, ''))) };
  }
  return { type: 'mc', label: 'Dịch câu', prompt: `<span class="sent">${HZ(sent)}</span>`, ...mcOpts(e.vi, pool.map(x => x.vi)) };
}
function isRight(q, a) {
  if (a === undefined || a === null) return false;
  if (['mc', 'listen', 'pos', 'error'].includes(q.type)) return a === q.a;
  if (q.type === 'match') return q.left.every((_, i) => a[i] !== undefined && q.shuf[a[i]] === i);
  if (q.type === 'order') return a.map(i => q.words[i]).join('') === q.a;
  if (q.type === 'write') return a.done && a.mistakes <= q.chars.length * 3;
  return false;
}
function correctText(q) {
  if (['mc', 'listen'].includes(q.type)) return q.opts[q.a];
  if (q.type === 'order') return q.a;
  if (q.type === 'match') return q.left.map((l, i) => l + ' – ' + q.right[i]).join(', ');
  if (q.type === 'pos') return 'vị trí ' + 'ABCD'[q.a];
  if (q.type === 'error') return q.segs[q.a];
  if (q.type === 'write') return q.chars.join('');
  return '';
}

function reshuffle(q) {
  if (q.type !== 'mc') return { ...q };
  const order = shuffle(q.opts.map((_, i) => i));
  return { ...q, opts: order.map(i => q.opts[i]), a: order.indexOf(q.a) };
}
/* Bộ luyện tập cho một bài: từ vựng + ngữ pháp + câu đặc biệt đã duyệt */
function buildLessonQuiz(d, ls, maxLesson) {
  const lv = d.vocab.filter(v => v.ls === ls), learned = d.vocab.filter(v => v.ls <= Math.max(ls, maxLesson));
  const pool = learned.length >= 4 ? learned : d.vocab;
  const kinds = ['meaning', 'hanzi', 'pinyin', 'tone', 'listen', 'write'];
  const qs = [];
  shuffle(lv).slice(0, 10).forEach((w, i) => { let q = null; for (let k = 0; k < 6 && !q; k++) q = vocabQ(w, pool, k === 0 ? kinds[i % kinds.length] : kinds[Math.floor(Math.random() * 4)]); if (q) qs.push(q); });
  if (lv.length >= 3) { const m = matchQ(lv); if (m) qs.push(m); }
  const exPool = d.examples.filter(e => e.ls <= Math.max(ls, maxLesson));
  const ex = d.examples.filter(e => e.ls === ls);
  const gq = shuffle(ex).map((e, i) => exampleQ(e, exPool.length >= 4 ? exPool : d.examples, ['order', 'fill', 'translate'][i % 3]));
  const sq = d.questions.filter(q => q.ls === ls).map(reshuffle);
  const vocabPart = shuffle(qs), grammarPart = shuffle([...gq, ...sq]).slice(0, 8);
  if (vocabPart.length) vocabPart[0].sec = 'Phần 1 – Từ vựng';
  if (grammarPart.length) grammarPart[0].sec = 'Phần 2 – Ngữ pháp';
  return [...vocabPart, ...grammarPart];
}
function buildGrammarQuiz(d, gids, maxLesson) {
  const exPool = d.examples.filter(e => e.ls <= maxLesson);
  const ex = d.examples.filter(e => gids.includes(e.gid));
  const qs = [];
  ex.forEach(e => { qs.push(exampleQ(e, exPool.length >= 4 ? exPool : d.examples, 'order')); qs.push(exampleQ(e, exPool.length >= 4 ? exPool : d.examples, Math.random() < .5 ? 'fill' : 'translate')); });
  return shuffle(qs).slice(0, 12);
}

/* ===== Lặp lại ngắt quãng ===== */
const DAY = 86400000, INT = [0, 1, 3, 7, 14, 30];
function rateCard(rec, r, now) {
  rec = { b: 0, d: 0, w: 0, ...(rec || {}) };
  if (r === 0) { rec.b = 0; rec.d = now; rec.w++; }
  else if (r === 1) { rec.b = Math.max(1, rec.b); rec.d = now + DAY; }
  else { rec.b = Math.min(5, rec.b + 1); rec.d = now + INT[rec.b] * DAY; }
  return rec;
}
function dueWords(vocab, srs, now, newLimit = 10) {

  const s = await getDoc(doc(db, 'content', myLevel())); content = s.exists() ? s.data() : null;
}

function lessonsList() { const set = new Set((content?.vocab || []).map(v => v.ls).concat((content?.examples || []).map(e => e.ls))); return [...set].sort((a, b) => a - b); }
function rankList(limit) {

  const g = S.pg;

    <div class="pairs">${g.tiles.map((t, x) => { const st = g.done.includes(x) ? 'done' : g.open.includes(x) ? 'open' : ''; return `<button class="ptile ${t.k === 'h' ? 'hz' : ''} ${st}" onclick="pairTap(${x})">${st ? esc(t.k === 'h' ? t.w.h : t.w.m) : ''}</button>`; }).join('')}</div></section>`;
}
window.pairTap = x => {
  const g = S.pg; if (g.lock || g.done.includes(x) || g.open.includes(x)) return;
  g.open.push(x);
  if (g.open.length === 2) {
    g.moves++; const [a, b] = g.open.map(i => g.tiles[i]);
    if (a.w.k === b.w.k && a.k !== b.k) { g.done.push(...g.open); g.open = []; speak(a.w.h); if (g.done.length === g.tiles.length) { g.end = Date.now(); if (!isTeacher) addPoints(5); } }
    else { g.lock = true; setTimeout(() => { g.open = []; g.lock = false; rv(); }, 800); }
  }
  rv();
};
/* 60 giây */

window.setAns = v => { if (S.quiz.checked) return; S.quiz.ans = v; rv(); };
window.matchTap = (side, i) => {
  const z = S.quiz; if (z.checked) return; const m = z.ans || (z.ans = {});
  if (side === 'L') z.matchSel = z.matchSel === i ? null : i;

window.orderTap = (i, rm) => { const z = S.quiz; if (z.checked) return; const a = z.ans || (z.ans = []); if (rm) a.splice(a.indexOf(i), 1); else a.push(i); rv(); };
function answered(q, a) {
  if (a === undefined || a === null) return false;
  if (q.type === 'match') return Object.keys(a).length === q.left.length;
  if (q.type === 'order') return a.length === q.words.length;
  if (q.type === 'write') return a.done;

window.checkQ = () => {
  const z = S.quiz, q = z.qs[z.i], ok = isRight(q, z.ans); z.checked = true; z.results.push(ok);
  if (z.quick && q.w && !isTeacher) srs[q.w] = rateCard(srs[q.w], ok ? 2 : 0, Date.now());
  else if (!ok && q.w && srs[q.w] !== undefined) { srs[q.w].w = (srs[q.w].w || 0) + 1; }
  else if (!ok && q.w) srs[q.w] = { b: 0, d: Date.now(), w: 1 };
  if (ok && !isTeacher) addPoints(2); else if (!ok) scheduleSave();
  rv();
};
window.nextQ = () => { const z = S.quiz; z.i++; z.ans = undefined; z.checked = false; z.matchSel = null; if (z.i >= z.qs.length) finishQuiz(); rv(); window.scrollTo(0, 0); };
function finishQuiz() {

  const m = !z.kind && z.title.match(/^Luyện (Bài (\d+)|Mở rộng)$/); if (m && !isTeacher) { const l = m[2] ? +m[2] : EXT, key = myLevel() + '-' + l; stats.best = stats.best || {}; stats.best[key] = Math.max(bestOf(myLevel(), l) || 0, pct); z.lesson = l; }
  if (z.kind && !isTeacher) { stats.ph = stats.ph || {}; stats.ph[z.kind] = Math.max(stats.ph[z.kind] || 0, pct); }
  if (!isTeacher) { stats.quizzes = [{ t: z.title, sc, n: z.qs.length, at: Date.now() }, ...(stats.quizzes || [])].slice(0, 20); scheduleSave(); }

function vQuiz() {

function vQuestion(q, a, done) {
  let body = '';
  if (q.type === 'mc' || q.type === 'listen') {
    body = (q.type === 'listen' ? `<button class="btn gold" style="margin-bottom:12px" onclick="${q.au ? `playAm('${q.au}')` : `speak('${esc(q.say)}')`}">${ic('speak')}Nghe lại</button>` : '')
      + `<div class="opts">${q.opts.map((o, i) => { let c = a === i ? 'sel' : ''; if (done) { if (i === q.a) c = 'right'; else if (a === i) c = 'wrong'; }
        return `<button class="opt ${c} ${q.hzOpts ? 'hz hzo' : ''}" onclick="setAns(${i})">${esc(o)}</button>`; }).join('')}</div>`;
  } else if (q.type === 'match') {
    const m = a || {}, col = j => { const k = Object.keys(m).find(k => m[k] === j); return k === undefined ? '' : 'c' + k; };
    body = `<div class="match"><div class="col">${q.left.map((l, i) => `<button class="chip hz ${m[i] !== undefined ? 'c' + i : ''} ${S.quiz.matchSel === i ? 'active' : ''}" onclick="matchTap('L',${i})">${esc(l)}</button>`).join('')}</div>
      <div class="col">${q.shuf.map((li, j) => `<button class="chip ${col(j)}" onclick="matchTap('R',${j})">${esc(q.right[li])}</button>`).join('')}</div></div>`;
  } else if (q.type === 'order') {
    const arr = a || [];
    body = `<div class="order-line">${arr.map(i => `<button class="chip hz" onclick="orderTap(${i},true)">${esc(q.words[i])}</button>`).join('') || '<span class="muted" style="padding:8px">Chạm vào các từ bên dưới theo đúng thứ tự</span>'}</div>
      <div class="bank">${q.words.map((w, i) => arr.includes(i) ? '' : `<button class="chip hz" onclick="orderTap(${i})">${esc(w)}</button>`).join('')}</div>`;
  } else if (q.type === 'pos') {
    let k = 0; body = `<div class="sent hz">${q.s.split(/\[([A-D])\]/).map((t, i) => { if (i % 2 === 0) return esc(t); const idx = k++;
      let c = a === idx ? 'sel' : ''; if (done) { if (idx === q.a) c = 'right'; else if (a === idx) c = 'wrong'; }
      return `<button class="slot ${c}" onclick="setAns(${idx})">${t}</button>`; }).join('')}</div>`;
  } else if (q.type === 'error') {
    body = `<div class="bank">${q.segs.map((t, i) => { let c = a === i ? 'sel' : ''; if (done) { if (i === q.a) c = 'right'; else if (a === i) c = 'wrong'; }
      return `<button class="chip hz ${c}" style="font-size:22px" onclick="setAns(${i})">${esc(t)}</button>`; }).join('')}</div>`;
  } else if (q.type === 'write') {
    body = `<div class="writers">${q.chars.map((c, i) => `<div data-write="${i}" style="width:150px;height:150px"></div>`).join('')}</div><div class="muted" id="wmsg">Viết từng nét theo đúng thứ tự.</div>`;
  }
  const prompt = q.type === 'pos' ? `Đặt ${HZ(q.word)} vào vị trí nào?` : q.type === 'error' ? 'Chạm vào phần bị sai trong câu.' : (q.special ? esc(q.prompt) : q.prompt);
  const fb = done ? (isRight(q, a) ? `<div class="fb ok fbm">${mascot('vui', 'fb-mascot')}<div>Chính xác!${q.expl ? ' ' + esc(q.expl) : ''}</div></div>` : `<div class="fb no fbm">${mascot('dongvien', 'fb-mascot')}<div>Chưa đúng. Đáp án: <span class="hz">${esc(correctText(q))}</span>${q.expl ? '<br>' + esc(q.expl) : ''}</div></div>`) : '';
  const rp = done && !isTeacher && !isGuest ? `<div style="text-align:right;margin-top:8px">${S.quiz.reported?.[S.quiz.i] ? '<span class="muted">Đã gửi báo lỗi, cảm ơn bạn!</span>' : `<button class="link-btn" onclick="reportQ()">${ic('flag')}Báo câu này sai</button>`}</div>` : '';
  return `<div class="q"><div class="q-h"><span class="q-t">${esc(q.label)}</span></div><div class="q-prompt">${prompt}</div>${body}${fb}${rp}</div>`;
}
function afterRender() {
  const z = S.quiz; if (!z || z.done) return; const q = z.qs[z.i];
  if (q.type === 'listen' && !z.checked && z.played !== z.i) { z.played = z.i; setTimeout(() => q.au ? playAm(q.au) : speak(q.say), 250); return; }
  if (q.type !== 'write' || z.checked) return;
  if (!window.HanziWriter) { $('#wmsg').textContent = 'Chưa tải được công cụ viết chữ, kiểm tra mạng.'; return; }
  let doneN = 0, mistakes = 0;
  document.querySelectorAll('[data-write]').forEach(el => {
    const ch = q.chars[+el.dataset.write];
    const w = HanziWriter.create(el, ch, { width: 150, height: 150, padding: 8, showCharacter: false, showOutline: false, strokeColor: '#556B2F', highlightColor: '#C9A04A', outlineColor: '#E8D9B5', drawingColor: '#3A3826' });
    w.quiz({ showHintAfterMisses: 3, onComplete: s => { mistakes += s.totalMistakes; if (++doneN === q.chars.length) { S.quiz.ans = { done: true, mistakes }; checkQ(); } } });
  });
}

/* ====== Báo lỗi câu hỏi ====== */
const plain = h => String(h || '').replace(/<br\s*\/?>/g, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
function qSummary(q) {
  if (q.type === 'pos') return `Đặt ${q.word} vào: ${q.s}`;
  if (q.type === 'error') return q.segs.join(' / ');
  if (q.type === 'order') return `${plain(q.prompt)} · Các phần: ${q.words.join(' / ')}`;
  if (q.type === 'match') return q.left.map((l, i) => l + ' – ' + q.right[i]).join(', ');
  if (q.type === 'listen') return `Nghe: ${q.say}`;
  return plain(q.prompt);
}
function ansText(q, a) {
  if (a === undefined || a === null) return '';
  if (['mc', 'listen'].includes(q.type)) return q.opts[a] ?? '';
  if (q.type === 'pos') return 'vị trí ' + 'ABCD'[a];
  if (q.type === 'error') return q.segs[a] ?? '';
  if (q.type === 'order') return a.map(i => q.words[i]).join('');
  if (q.type === 'write') return a.mistakes >= 99 ? 'bỏ qua' : `viết sai ${a.mistakes} nét`;
  return '';
}

window.readXlsx = async f => {
  if (!f) return; if (!window.XLSX) { toast('Chưa tải được công cụ đọc Excel, kiểm tra mạng'); return; }
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }); const sheets = {};

/* ====== Lộ trình: chuông hoa linh lan ====== */
const PASS = 80;
const bestOf = (lv, l) => { const b = stats.best || {}; return b[lv + '-' + l] ?? (lv === 'HSK1' ? b[l] : undefined); };
const bloomed = (lv, l) => (bestOf(lv, l) || 0) >= PASS;
const phDone = () => ['tone', 'pair', 'sandhi'].every(k => ((stats.ph || {})[k] || 0) >= PASS);
const BELL_OPEN = '<path d="M0 -11 L0 -7" stroke="#556B2F" stroke-width="1.6" stroke-linecap="round"/><path d="M-8 -1 C-8 -11 8 -11 8 -1 C8 1 9 3 10 4 C7 5 6 3 4.5 4.5 C3 6 1.5 4 0 5 C-1.5 4 -3 6 -4.5 4.5 C-6 3 -7 5 -10 4 C-9 3 -8 1 -8 -1 Z" fill="#fff" stroke="#8A9A5B" stroke-width="1.1" stroke-linejoin="round"/><path d="M-4 -8 C-2 -6 2 -6 4 -8 C2 -10 -2 -10 -4 -8 Z" fill="#8A9A5B"/><path d="M-5 -3 C-5 -7 -2 -8 -1 -8" stroke="#E4E9CF" stroke-width="1.4" fill="none" stroke-linecap="round"/>', BELL_BUD = '<path d="M0 -11 L0 -6" stroke="#556B2F" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="0" cy="-1" rx="4.5" ry="5.5" fill="#C9D3A8" stroke="#8A9A5B" stroke-width="1"/>';
const bellSvg = (open, size = 40) => `<svg width="${size}" height="${size}" viewBox="-13 -13 26 24" aria-hidden="true">${open ? BELL_OPEN : BELL_BUD}</svg>`;
function sprig(lv) {
  const n = maxLs(lv), w = Math.max(280, n * 22 + 26); let g = '';
  for (let i = 0; i < n; i++) { const x = 15 + i * 22, y = 6 + Math.sin((i + .5) / n * Math.PI) * -3 + i * .55;
    g += `<g transform="translate(${x},${y + 15}) scale(1.05)">${bloomed(lv, i + 1) ? BELL_OPEN : BELL_BUD}</g>`; }
  return `<svg class="sprig" viewBox="0 0 ${w} 44" style="width:${w}px;max-width:100%" aria-hidden="true"><path d="M2 6 C${w * .35} 0 ${w * .65} 2 ${w - 2} 16" stroke="#556B2F" stroke-width="2" fill="none" stroke-linecap="round"/>${g}</svg>`;
}
const mascot = (k, cls = '') => `<img class="mascot-img ${cls}" src="${MASCOT[k]}" alt="">`;
function nextLesson(lv) { const ls = lessonsList().filter(l => l !== EXT && l <= myLesson()); return ls.find(l => !bloomed(lv, l)) || null; }
function vPath() {
  const lv = myLevel(), ls = content ? lessonsList() : [], done = ls.filter(l => l !== EXT && bloomed(lv, l)).length, n = maxLs(lv);
  const showPh = lv === 'HSK1', ph = stats.ph || {}, phOk = phDone();
  const nx = nextLesson(lv);
  const cta = isGuest ? (showPh ? `<button class="btn ghost" onclick="go('sound')">Vào phòng luyện âm ${ic('arrow')}</button>` : '')
    : showPh && !phOk ? `<button class="btn ghost" onclick="go('sound')">Luyện âm trước khi vào Bài 1 ${ic('arrow')}</button>`
    : nx ? `<button class="btn ghost" onclick="startLesson(${nx})">${bestOf(lv, nx) === undefined ? 'Bắt đầu ôn luyện' : 'Ôn tiếp'} ${lessonLabel(nx)} ${ic('arrow')}</button>` : '';
  const chip = (k, l) => { const v = ph[k]; return `<span class="pill ${v >= PASS ? 'ok' : v !== undefined ? 'warn' : ''}">${l} ${v !== undefined ? v + '%' : 'chưa làm'}</span>`; };
  return `<section class="path-hero"><div class="grow">
      <div class="path-kicker">Lộ trình của bạn · ${esc(lv)}</div>
      <h2>Mỗi bài một chuông hoa,<br><span>cả cấp thành một cành linh lan.</span></h2>
      <p>Làm bài luyện đạt từ ${PASS}% thì chuông hoa của bài đó nở.${isGuest ? ' Khách chỉ dùng được Phòng luyện âm.' : ''}</p>
      ${!isTeacher && !isGuest ? `<div class="path-today">${ic('clock')}Hôm nay ${Math.min(10, Math.floor(todaySec() / 60))}/10 phút · chuỗi ${currentStreak(stats)} ngày</div>` : ''}
      <div>${cta}</div></div>${mascot(done && done >= ls.filter(l => l !== EXT).length && ls.length ? 'chuong' : 'chao', 'hero-mascot')}</section>
    ${showPh ? `<section class="card ph-card"><div class="ph-ic">${ic('speak')}</div><div class="grow"><small class="muted">Nền tảng trước hành trình</small><h3>Phòng luyện âm</h3>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px">${phOk ? '<span class="pill ok">Đã hoàn thành cả 3 phần</span>' : chip('tone', 'Thanh điệu') + chip('pair', 'Âm dễ nhầm') + chip('sandhi', 'Biến điệu')}</div></div>
      <div class="row" style="gap:8px;flex-wrap:wrap">${phOk && !isGuest ? `<button class="btn ghost sm" onclick="go('sound')">Vào lại phòng luyện âm</button>${bestOf(lv, 1) === undefined ? `<button class="btn" onclick="startLesson(1)">Bắt đầu ôn luyện Bài 1 ${ic('arrow')}</button>` : ''}` : `<button class="btn" onclick="go('sound')">Vào phòng luyện âm ${ic('arrow')}</button>`}</div></section>` : ''}
    <section class="card level-bar"><span class="muted" style="padding:0 6px">Cấp độ</span>${['HSK1', 'HSK2', 'HSK3'].map(l => `<button class="tab ${lv === l ? 'on' : ''}" onclick="${isTeacher ? `setTeacherLevel('${l}')` : `setMine('level','${l}')`}">${l}</button>`).join('')}
      <span class="grow"></span><span class="muted">Đổi "đã học đến bài" ở ô phía trên</span></section>
    ${content ? `<div class="row" style="margin:14px 0 4px;gap:10px;flex-wrap:wrap">${sprig(lv)}<span class="muted">${done}/${n} chuông đã nở</span></div>
    <div class="path-cards">${ls.map(l => { const lock = isGuest || (l === EXT ? myLesson() < n : l > myLesson()), b = bestOf(lv, l), open = bloomed(lv, l);
      const nv = (content.vocab || []).filter(v => v.ls === l).length, ng = (content.grammar || []).filter(g => g.ls === l).length;
      return `<div class="pcard ${lock ? 'lock' : ''} ${l === nx ? 'cur' : ''}"><div class="row"><span class="pnum">${lessonLabel(l)}</span><span class="grow"></span>${lock ? ic('lock') : bellSvg(open)}</div>
        <div class="muted">${nv} từ${ng ? ' · ' + ng + ' ngữ pháp' : ''}</div>
        <small>${isGuest ? 'Đăng nhập học viên để luyện' : lock ? 'Mở khi bạn học đến bài này' : open ? `Đã nở · cao nhất ${b}%` : b !== undefined ? `Cao nhất ${b}% · cần ${PASS}%` : 'Chưa làm'}</small>
        ${lock ? '' : `<button class="btn ${open ? 'ghost' : ''} sm" onclick="startLesson(${l})">${open ? 'Luyện lại' : 'Luyện bài'}</button>`}</div>`; }).join('')}</div>`
    : `<div class="card" style="margin-top:14px"><p class="muted">Cô giáo chưa tải nội dung cho cấp độ này.</p></div>`}`;
}

/* ====== Ôn nhanh 5 phút ====== */
function recentLesson() { const q = (stats.quizzes || []).find(x => /^Luyện Bài \d+$/.test(x.t)); const l = q ? +q.t.match(/\d+/)[0] : myLesson(); return Math.min(l, maxLs(myLevel())); }
window.startQuick = () => {
  if (!content) { toast('Chưa có nội dung cho cấp độ này'); return; }
  startQuiz('Ôn nhanh 5 phút', buildQuickQuiz(content, srs, Date.now(), learnedVocab(), recentLesson())); if (S.quiz) S.quiz.quick = true;
};
function quickCard() {
  if (isTeacher || isGuest || !content) return '';
  const due = dueWords(learnedVocab(), srs, Date.now(), 0).length, l = recentLesson();
  return `<section class="card quick-card">${mascot('chao', 'quick-mascot')}<div class="grow"><h3>Ôn nhanh 5 phút</h3>
    <p class="muted">${due ? `<b>${due} từ</b> đến hạn ôn` : 'Ôn từ hay sai và từ mới'} + 5 câu ngữ pháp ${lessonLabel(l)}. Một lượt khoảng 15 câu.</p></div>
    <button class="btn" onclick="startQuick()">Bắt đầu ${ic('arrow')}</button></section>`;
}

/* ====== Giáo viên: tổng hợp lớp ====== */
let cls = null;
async function loadClass() {
  const s = await getDocs(collection(db, 'users'));
  const us = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(u => u.approved && (u.email || '').toLowerCase() !== TEACHER_EMAIL.toLowerCase());
  await Promise.all(us.map(async u => {
    const [a, b] = await Promise.all([getDoc(doc(db, 'users', u.id, 'data', 'srs')), getDoc(doc(db, 'users', u.id, 'data', 'stats'))]);
    u.srs = a.exists() ? a.data().map || {} : {}; u.st = b.exists() ? b.data() : {};
  }));
  cls = us; rv();
}
function last7() { return Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return dayStr(d); }); }
function vClass() {
  if (!cls) { loadClass().catch(e => toast('Lỗi tải dữ liệu lớp: ' + e.code)); return '<div class="card"><p class="muted">Đang tải dữ liệu cả lớp…</p></div>'; }
  const lv = S.level, n = maxLs(lv), days = last7(), us = cls.filter(u => (u.level || 'HSK1') === lv);
  const act = us.map(u => { const m = u.st.mins || {}, secs = days.map(d => m[d] || 0);
    return { u, mins: Math.round(secs.reduce((a, b) => a + b, 0) / 60), days: secs.filter(x => x >= 600).length, last: u.st.lastDay || '', streak: currentStreak(u.st) }; })
    .sort((a, b) => a.mins - b.mins);
  const idle = act.filter(a => a.mins === 0);
  const bo = (st, l) => { const b = st.best || {}; return b[lv + '-' + l] ?? (lv === 'HSK1' ? b[l] : undefined); };
  const les = Array.from({ length: n }, (_, i) => i + 1).map(l => { const sc = us.map(u => bo(u.st, l)).filter(x => x !== undefined);
    return { l, tried: sc.length, pass: sc.filter(x => x >= PASS).length, avg: sc.length ? Math.round(sc.reduce((a, b) => a + b, 0) / sc.length) : null }; });
  const vk = {}; (content?.vocab || []).forEach(v => vk[v.k] = v);
  const agg = {}; us.forEach(u => Object.entries(u.srs).forEach(([k, r]) => { if (!vk[k] || !(r.w > 0)) return; (agg[k] = agg[k] || { w: 0, n: 0 }); agg[k].w += r.w; agg[k].n++; }));
  const top = Object.entries(agg).sort((a, b) => b[1].n - a[1].n || b[1].w - a[1].w).slice(0, 10);
  window._topWords = top.map(([k]) => vk[k]);
  return `<div class="row" style="margin-bottom:12px;gap:8px;flex-wrap:wrap"><h2 style="font-size:20px" class="grow">Tổng hợp lớp ${esc(lv)} · ${us.length} học viên</h2>
      ${['HSK1', 'HSK2', 'HSK3'].map(l => `<button class="btn ${l === lv ? '' : 'ghost'} sm" onclick="setTeacherLevel('${l}')">${l}</button>`).join('')}<button class="btn ghost sm" onclick="cls=null;rv()">Tải lại</button></div>
    <div class="grid g3">
      <div class="tile"><small>Chưa học trong 7 ngày</small><div class="big">${idle.length}</div></div>
      <div class="tile"><small>Học đủ 10 phút ≥ 3 ngày/tuần</small><div class="big">${act.filter(a => a.days >= 3).length}/${us.length}</div></div>
      <div class="tile"><small>Tổng phút cả lớp 7 ngày</small><div class="big">${act.reduce((a, b) => a + b.mins, 0)}</div></div>
    <section class="card span3"><div class="card-h">${leaf}<h3>Hoạt động 7 ngày qua</h3></div>
      ${us.length ? `<div class="table-wrap"><table><tr><th>Học viên</th><th>Số phút</th><th>Ngày học đủ</th><th>Chuỗi</th><th>Lần học gần nhất</th><th>Đã học đến</th></tr>
      ${act.map(a => `<tr><td><b>${esc(a.u.name)}</b>${a.mins === 0 ? ' <span class="pill bad">Chưa học tuần này</span>' : ''}</td><td>${a.mins}'</td><td>${a.days}/7</td><td>${a.streak}</td><td class="muted">${a.last ? a.last.split('-').reverse().join('/') : '–'}</td><td>Bài ${a.u.lesson || 1}</td></tr>`).join('')}</table></div>` : '<p class="muted">Chưa có học viên nào ở cấp độ này.</p>'}</section>
    <section class="card span2"><div class="card-h">${leaf}<h3>Kết quả từng bài</h3></div>
      <p class="muted" style="margin-top:-6px">Đạt = làm bài luyện từ ${PASS}% trở lên (điểm cao nhất của mỗi học viên). Bài tô vàng: đã có người làm nhưng chưa tới một nửa đạt.</p>
      <div class="table-wrap"><table><tr><th>Bài</th><th>Đã làm</th><th>Đạt</th><th>Điểm TB</th><th style="width:40%"></th></tr>
      ${les.filter(x => x.l <= Math.max(1, ...us.map(u => u.lesson || 1))).map(x => `<tr class="${x.tried && x.pass * 2 < x.tried ? 'warn-row' : ''}"><td>Bài ${x.l}</td><td>${x.tried}/${us.length}</td><td>${x.pass}</td><td>${x.avg ?? '–'}${x.avg !== null ? '%' : ''}</td><td><div class="bar"><i style="width:${us.length ? x.pass / us.length * 100 : 0}%"></i></div></td></tr>`).join('')}</table></div></section>
    <section class="card"><div class="card-h">${leaf}<h3>10 từ cả lớp hay sai</h3></div>
      ${top.length ? top.map(([k, r]) => { const v = vk[k]; return `<div class="list-item"><span class="hz" style="font-size:20px;min-width:48px">${esc(v.h)}</span><div class="grow">${esc(v.p)} · ${esc(v.m)}<div class="muted">Bài ${v.ls === EXT ? 'MR' : v.ls}</div></div><span class="pill bad">${r.n} người</span></div>`; }).join('')
        + `<button class="btn ghost sm" style="margin-top:10px" onclick="copyTop()">Chép danh sách</button>` : '<p class="muted">Chưa có dữ liệu.</p>'}</section>
    </div>`;
}
window.copyTop = async () => { const t = (window._topWords || []).map(v => `${v.h}\t${v.p}\t${v.m}`).join('\n'); try { await navigator.clipboard.writeText(t); toast('Đã chép, dán vào slide hoặc Excel được ngay'); } catch (e) { toast('Máy chưa cho phép chép tự động'); } };

/* ====== Cài web như ứng dụng ====== */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (['home', 'intro'].includes(S.page) && !S.quiz) rv(); });
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone; } catch (e) { return false; } };
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent || '');
function installCard() {
  if (isStandalone() || LS.get('noinstall')) return '';
  if (!installEvt && !isIOS() && !/android/i.test(navigator.userAgent || '')) return '';
  return `<section class="card install-card"><div class="ph-ic">${ic('upload')}</div><div class="grow"><h3>Cài web lên điện thoại</h3>
    <p class="muted">${installEvt ? 'Bấm Cài đặt để có biểu tượng hoa linh lan trên màn hình chính, mở ra như một ứng dụng.' : isIOS() ? 'Trên iPhone: mở web bằng Safari → bấm nút Chia sẻ (ô vuông có mũi tên lên) → chọn "Thêm vào MH chính".' : 'Trên Android: bấm dấu ⋮ của Chrome → chọn "Thêm vào màn hình chính" hoặc "Cài đặt ứng dụng".'}</p></div>
    <div class="row" style="gap:8px">${installEvt ? `<button class="btn" onclick="doInstall()">Cài đặt</button>` : ''}<button class="btn ghost sm" onclick="LS.set('noinstall',1);rv()">Ẩn</button></div></section>`;
}
window.doInstall = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { } installEvt = null; rv(); };
window.LS = LS;
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }

const VIEWS = { class: vClass, intro: vIntro, exam: vExam, sound: vSound, path: vPath, practice: vPath, feedback: vFeedback, feedbacks: vFeedbacks, reports: vReports, home: vHome, review: vReview, practice: vPractice, grammar: vGrammar, rank: vRank, me: vMe, students: vStudents, content: vContent };
boot();

</script>
</body>
